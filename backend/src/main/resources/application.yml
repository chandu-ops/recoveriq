spring:
  application:
    name: recoveriq

  datasource:
    url: jdbc:postgresql://localhost:5432/recoveriq
    username: ${DB_USERNAME:recoveriq}
    password: ${DB_PASSWORD:recoveriq}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate      # schema comes from Flyway, never auto-generated
    properties:
      hibernate:
        format_sql: true
    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info